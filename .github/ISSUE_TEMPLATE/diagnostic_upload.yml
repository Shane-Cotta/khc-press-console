name: Diagnostic upload
description: The format of a diagnostic ticket sent from a console. Tickets are normally opened by the console itself.
title: "[diag] "
labels: ["diagnostic"]
body:
  - type: markdown
    attributes:
      value: |
        **You normally do not fill this in.** When a technician sends a **diagnostic upload** from a console, the
        KHC diagnostics service opens an issue in this format by itself and the console shows its ticket number.
        Use this form only if the console showed a ticket number but no issue appeared, or to follow up a ticket.

        **Everything here is public.** A diagnostic issue holds the description and the console's redacted
        diagnostics (versions, press model and firmware, licence state, recent errors). Your name and company are
        never posted: the console sends them to KHC privately, with the ticket. Do not type names, company names,
        licence numbers, Wi-Fi names or passwords below.

        **If the press did not stop when it should have**, say so in the first line of the description, and stop
        using KHC Press Console until the issue is understood. To report a problem without a diagnostic upload, use
        the bug report instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue holds no names, company names, licence numbers, Wi-Fi names or passwords.
          required: true
  - type: input
    id: ticket
    attributes:
      label: Ticket number
      description: As the console showed it after the upload.
      placeholder: e.g. KHC-20261002-7F3K
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, as typed on the console (at most 1000 characters).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KHC Press Console version
      description: Bottom right of every screen, or the ABOUT screen. If ABOUT shows an SD card image version too, give both.
      placeholder: e.g. 0.3.0 (card 0.3.0)
    validations:
      required: true
  - type: dropdown
    id: press
    attributes:
      label: Press model
      options:
        - Apex 10 Evolution
        - Revolution
        - 650 PRO / 650 X / 750 AutoDrive
        - 1050 PRO AutoDrive
        - 1050 X AutoDrive
        - 1050 LTE
        - Other (say which in the description)
        - No press connected
  - type: textarea
    id: summary
    attributes:
      label: Diagnostics
      description: |
        Filled in by the diagnostics service: the versions (app, card, base), the press (model, firmware, motor, link,
        calibrated), the licence state (never a number), the last errors with their code locations (no messages) and
        the last alert titles. The logs bundle is stored privately under the ticket number and is never attached here.
      render: text
